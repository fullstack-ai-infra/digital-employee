name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Node 24's experimental test coverage reporter can end with a JSON
          # aggregation error after every test passes. Keep release coverage on
          # the repository-supported Node 22 line; normal CI still tests Node 24.
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run release:check -- --tag "$GITHUB_REF_NAME"
      - name: Verify npm package archives
        run: |
          pack_destination="$RUNNER_TEMP/release-pack"
          mkdir -p "$pack_destination"
          npm pack --json --pack-destination "$pack_destination" > "$RUNNER_TEMP/root-pack.json"
          npm pack ./packages/core --json --pack-destination "$pack_destination" > "$RUNNER_TEMP/core-pack.json"
          node ./scripts/release-pack-check.js \
            "$pack_destination" \
            "$RUNNER_TEMP/root-pack.json" \
            "$RUNNER_TEMP/core-pack.json"
      - id: package
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - id: package
        shell: bash
        run: |
          npm pack --json > package-output.json
          package_file="$(node --input-type=module -e "import fs from 'node:fs'; const [entry] = JSON.parse(fs.readFileSync('package-output.json', 'utf8')); process.stdout.write(entry.filename)")"
          sha256sum "$package_file" > "$package_file.sha256"
          echo "file=$package_file" >> "$GITHUB_OUTPUT"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_FILE: ${{ steps.package.outputs.file }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$PACKAGE_FILE" "$PACKAGE_FILE.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$PACKAGE_FILE" "$PACKAGE_FILE.sha256" \
              --verify-tag \
              --generate-notes \
              --title "Digital Employee $GITHUB_REF_NAME"
          fi

  npm-root:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.18.0
      - run: npm ci
      - name: Publish root npm package
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "$package_name@$package_version is already published"
            exit 0
          fi
          npm publish --access public

  npm-core:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.18.0
      - run: npm ci
      - name: Publish core npm package
        run: |
          package_name="$(node -p "require('./packages/core/package.json').name")"
          package_version="$(node -p "require('./packages/core/package.json').version")"
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "$package_name@$package_version is already published"
            exit 0
          fi
          npm publish ./packages/core --access public

  ghcr:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Stage the declared npm candidate for the container
        shell: bash
        run: |
          pack_destination="$RUNNER_TEMP/ghcr-pack"
          mkdir -p "$pack_destination" .cache/distribution
          npm pack --json --pack-destination "$pack_destination" > "$RUNNER_TEMP/ghcr-root-pack.json"
          package_file="$(node --input-type=module -e "import fs from 'node:fs'; const [entry] = JSON.parse(fs.readFileSync('$RUNNER_TEMP/ghcr-root-pack.json', 'utf8')); process.stdout.write(entry.filename)")"
          cp "$pack_destination/$package_file" .cache/distribution/digital-employee-package.tgz
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish image
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$VERSION" \
            --tag "$image:$GITHUB_REF_NAME" \
            --tag "$image:$VERSION" \
            --tag "$image:latest" \
            .
          docker push "$image:$GITHUB_REF_NAME"
          docker push "$image:$VERSION"
          docker push "$image:latest"
